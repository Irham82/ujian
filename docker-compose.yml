services:
  postgres:
    image: postgres:16-alpine
    container_name: cbt-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-cbt_pro_db}
    volumes:
      - cbt_postgres_data:/var/lib/postgresql/data
    networks:
      - cbt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbt_admin} -d ${POSTGRES_DB:-cbt_pro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cbt-pro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - cbt_redis_data:/data
    networks:
      - cbt_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cbt-pro-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://${POSTGRES_USER:-cbt_admin}:${POSTGRES_PASSWORD:-change_me_in_env}@postgres:5432/${POSTGRES_DB:-cbt_pro_db}
      REDIS_DRIVER: ioredis
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_32_chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_32_chars_min}
      CSRF_SECRET: ${CSRF_SECRET:-change_me_csrf_secret_32_chars_min}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ujian.sekolah.sch.id}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cbt_internal_net
      - cbt_proxy_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cbt-pro-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      - backend
    networks:
      - cbt_proxy_net

  nginx:
    image: nginx:1.27-alpine
    container_name: cbt-pro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cbt_proxy_net

networks:
  # Database & Redis isolated on internal network only (never exposed to public host)
  cbt_internal_net:
    internal: true
  cbt_proxy_net:
    driver: bridge

volumes:
  cbt_postgres_data:
  cbt_redis_data:
